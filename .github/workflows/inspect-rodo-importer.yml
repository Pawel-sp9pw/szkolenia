name: Inspect RODO importer

on:
  push:
    paths:
      - '.github/workflows/inspect-rodo-importer.yml'
      - 'moodle/training/rodo/**'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose encoded package
        run: |
          set -euo pipefail
          cd moodle/training/rodo
          for f in import.php.gz.b64 courses.json.gz.b64; do
            echo "--- $f ---"
            wc -c "$f"
            echo "head: $(head -c 40 "$f")"
            echo "tail: $(tail -c 40 "$f")"
            python3 - "$f" <<'PY'
          import pathlib,sys,string
          p=pathlib.Path(sys.argv[1])
          b=p.read_bytes()
          allowed=set((string.ascii_letters+string.digits+'+/=\r\n\t ').encode())
          bad=[(i,x) for i,x in enumerate(b) if x not in allowed]
          print('invalid-byte-count',len(bad))
          print('first-invalid',bad[:20])
          PY
          done
      - name: Recover and decode package
        run: |
          set -euo pipefail
          cd moodle/training/rodo
          python3 - <<'PY'
          import base64,gzip,pathlib,re
          for src,dst in [('import.php.gz.b64','/tmp/import.php'),('courses.json.gz.b64','/tmp/courses.json')]:
              raw=pathlib.Path(src).read_text(encoding='utf-8',errors='ignore')
              clean=''.join(re.findall(r'[A-Za-z0-9+/=]',raw))
              print(src,'raw chars',len(raw),'clean chars',len(clean),'mod4',len(clean)%4)
              try:
                  data=base64.b64decode(clean,validate=False)
                  print(src,'decoded bytes',len(data),'magic',data[:8].hex())
                  out=gzip.decompress(data)
                  pathlib.Path(dst).write_bytes(out)
                  print(src,'uncompressed bytes',len(out))
              except Exception as e:
                  print(src,'RECOVERY FAILED',repr(e))
                  raise
          PY
      - name: Validate syntax and JSON
        run: |
          set -euo pipefail
          php -l /tmp/import.php
          python3 -m json.tool /tmp/courses.json >/dev/null
          echo "JSON bytes: $(wc -c </tmp/courses.json)"
          echo "Importer bytes: $(wc -c </tmp/import.php)"
      - name: Inspect category and quiz API usage
        run: |
          set -euo pipefail
          echo '--- CATEGORY REFERENCES ---'
          grep -n -C 10 -E 'course_category|core_course_category|course_categories|RODO' /tmp/import.php || true
          echo '--- QUESTION/QUIZ REFERENCES ---'
          grep -n -C 6 -E 'question_bank_helper|question_get_default_category|add_random_questions|quiz_settings|qformat_xml|importprocess' /tmp/import.php || true
      - name: Inspect package schema
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/courses.json'))
          print('TOP TYPE', type(d).__name__)
          if isinstance(d, dict):
              print('TOP KEYS', sorted(d.keys()))
              courses=d.get('courses', d)
          else:
              courses=d
          items=list(courses.items()) if isinstance(courses,dict) else list(enumerate(courses))
          print('COURSE COUNT',len(items))
          for k,v in items:
              if isinstance(v,dict):
                  print('COURSE',k,'KEYS',sorted(v.keys()))
                  for qk in ('questions','questionbank','sections','modules'):
                      if qk in v:
                          try: print(' ',qk,'COUNT',len(v[qk]))
                          except Exception: pass
          PY
