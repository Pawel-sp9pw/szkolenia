name: Inspect RODO importer

on:
  push:
    paths:
      - '.github/workflows/inspect-rodo-importer.yml'
      - 'moodle/training/rodo/**'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover importer
        run: |
          set -euo pipefail
          cd moodle/training/rodo
          python3 - <<'PY'
          import base64,gzip,pathlib,re
          raw=pathlib.Path('import.php.gz.b64').read_text(encoding='utf-8',errors='ignore')
          clean=''.join(re.findall(r'[A-Za-z0-9+/=]',raw))
          clean += '=' * ((4 - len(clean) % 4) % 4)
          data=base64.b64decode(clean,validate=True)
          out=gzip.decompress(data)
          pathlib.Path('/tmp/import.php').write_bytes(out)
          print('importer bytes',len(out))
          PY
          php -l /tmp/import.php
      - name: Print importer source
        run: |
          set -euo pipefail
          nl -ba /tmp/import.php
